<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="55%" stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#004aad" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#004aad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#018038" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#018038" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="34" height="34" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#hatch)"/>
  <circle cx="1180" cy="120" r="420" fill="url(#glow1)"/>
  <circle cx="260" cy="620" r="380" fill="url(#glow2)"/>

  <!-- großes Schild-Motiv, mittig-rechts -->
  <g transform="translate(1080,350)" opacity="0.9">
    <path d="M0 -230 L190 -150 V40 C190 190 90 280 0 320 C-90 280 -190 190 -190 40 V-150 Z"
          fill="none" stroke="#02a34a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-70 10 L-15 70 L95 -70" fill="none" stroke="#02a34a" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Schloss-Motiv, links -->
  <g transform="translate(330,380)" opacity="0.85">
    <rect x="-95" y="-10" width="190" height="150" rx="18" fill="none" stroke="#5b9bef" stroke-width="7"/>
    <path d="M-60 -10 V-70 C-60 -114 -33 -145 0 -145 C33 -145 60 -114 60 -70 V-10"
          fill="none" stroke="#5b9bef" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="55" r="16" fill="#5b9bef"/>
    <rect x="-7" y="60" width="14" height="45" rx="6" fill="#5b9bef"/>
  </g>
</svg>
