<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="55%" stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#018038" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#018038" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#004aad" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#004aad" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="34" height="34" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#hatch)"/>
  <circle cx="1300" cy="120" r="400" fill="url(#glow2)"/>
  <circle cx="250" cy="600" r="380" fill="url(#glow1)"/>

  <!-- großes 2x2-Kachelraster, mittig-rechts (Menü-Symbol vergrößert) -->
  <g transform="translate(1180,340)" opacity="0.85" stroke-linejoin="round">
    <rect x="-160" y="-160" width="130" height="130" rx="20" fill="none" stroke="#02a34a" stroke-width="7"/>
    <rect x="30" y="-160" width="130" height="130" rx="20" fill="none" stroke="#5b9bef" stroke-width="7"/>
    <rect x="-160" y="30" width="130" height="130" rx="20" fill="none" stroke="#5b9bef" stroke-width="7"/>
    <rect x="30" y="30" width="130" height="130" rx="20" fill="none" stroke="#02a34a" stroke-width="7"/>
  </g>

  <!-- Kompass/Wegweiser-Motiv, links -->
  <g transform="translate(320,360)" opacity="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="120" stroke="#5b9bef" stroke-width="6"/>
    <path d="M0 -70 L22 10 L-22 10 Z" fill="#02a34a" stroke="none" transform="rotate(35)"/>
    <circle cx="0" cy="0" r="10" fill="#5b9bef" stroke="none"/>
  </g>
</svg>
